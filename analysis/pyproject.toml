[project]
name = "invigil-analysis"
version = "0.1.0"
description = "Pre-declared statistical analysis for Invigil Study 001 (METHODOLOGY section 6)"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
